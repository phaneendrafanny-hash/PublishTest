<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Side — Bright Welcome Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px;
      background: #fff4d8; color: #26352d;
      font-family: Georgia, "Times New Roman", serif;
    }
    header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
    .logo { font-size: 23px; font-weight: bold; }
    nav a { color: #26352d; margin-left: 20px; text-decoration: none; font: 14px Arial, sans-serif; }
    main {
      max-width: 1000px; margin: 72px auto 0; display: grid;
      grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center;
    }
    .eyebrow { color: #d36c42; font: bold 12px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { font-size: clamp(44px, 7vw, 76px); line-height: 1.02; margin: 16px 0; }
    p { max-width: 440px; font: 17px/1.7 Arial, sans-serif; color: #64736a; }
    .button {
      display: inline-block; margin-top: 18px; padding: 14px 24px;
      border-radius: 30px; background: #d96f49; color: white;
      text-decoration: none; font: bold 14px Arial, sans-serif;
    }
    .sun {
      min-height: 320px; border-radius: 48% 52% 42% 58%;
      background: radial-gradient(circle at 50% 42%, #ffe48b 0 27%, #f6a65d 28% 48%, #e77d59 49% 70%, #d96f49 71%);
      display: grid; place-items: center; font-size: 74px;
      transform: rotate(-5deg);
    }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; margin-top: 48px; } .sun { min-height: 230px; } nav { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">☀ Sunny Side</div>
    <nav><a href="#home">Home</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  </header>
  <main id="home">
    <section>
      <div class="eyebrow">A brighter kind of day</div>
      <h1>Hello,<br>good things.</h1>
      <p>A cheerful, warm welcome page with a sunny palette, classic typography and a playful visual.</p>
      <a class="button" href="#about">Say hello</a>
    </section>
    <div class="sun" aria-label="Sun illustration">✦</div>
  </main>
</body>
</html>
