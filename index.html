<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight — Dark Landing Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #10131f; color: #f5f3ff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(720px, 90vw); padding: 56px; border: 1px solid #34364d;
      border-radius: 22px; background: linear-gradient(145deg, #20243a, #151827);
      box-shadow: 0 24px 70px #0008;
    }
    .tag { color: #a99cff; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; }
    h1 { margin: 18px 0; font-size: clamp(42px, 8vw, 72px); line-height: .98; }
    p { color: #b9bdd0; line-height: 1.7; max-width: 480px; }
    a {
      display: inline-block; margin-top: 20px; padding: 14px 22px;
      color: #171526; background: #b7a8ff; border-radius: 8px;
      text-decoration: none; font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">A little space to think</div>
    <h1>Make room<br>for what matters.</h1>
    <p>A calm, dark landing page with a bold headline, muted supporting text and one clear action.</p>
    <a href="#more">Explore the idea</a>
  </main>
</body>
</html>
